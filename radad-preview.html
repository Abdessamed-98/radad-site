/* ============================================================
   RADAD DESIGN SYSTEM v5
   Surfaces use ring + inset highlight + layered elevation,
   never a flat 1px border. That is what reads as physical.
   ============================================================ */

:root{
  /* ---- palette : light ---- */
  --white:#FFFFFF;
  --bg:#F0F6FC;
  --bg-2:#FFFFFF;
  --bg-sunk:#E1EDF8;
  --ink:#052659;
  --ink-2:#3C5578;
  --ink-3:#7B8FAC;
  --ink-4:#A6B7CB;

  --brand:#0077EE; --brand-hi:#2E93FF; --brand-lo:#005CC4; --brand-d:#0061CC;
  --brand-2:#00B4F0; --brand-tint:#E8F3FE; --brand-tint-2:#C9E3FD;
  --mint:#0F9D58; --mint-tint:#E6F6EE;
  --amber:#D97706; --amber-tint:#FDF1E3;
  --rose:#DC2E5C; --rose-tint:#FDEBF0;

  /* ---- structural ---- */
  --line:rgba(5,38,89,.075);
  --line-2:rgba(5,38,89,.13);
  --line-3:rgba(5,38,89,.20);
  --hl:rgba(255,255,255,.9);
  --hl-soft:rgba(255,255,255,.55);
  --shade:5,38,89;

  --surf-1:linear-gradient(180deg,#FFFFFF 0%,#FCFDFF 100%);
  --surf-2:linear-gradient(180deg,#F8FCFF 0%,#F1F8FD 100%);
  --surf-3:linear-gradient(180deg,#E9F2FA 0%,#DEEBF6 100%);
  --surf-brand:linear-gradient(165deg,#2E93FF 0%,#0077EE 42%,#0057C8 100%);
  --surf-btn:linear-gradient(180deg,#2E93FF 0%,#0069D8 100%);

  /* ---- elevation ---- */
  --ring:0 0 0 1px var(--line);
  --ring-2:0 0 0 1px var(--line-2);
  --hi:inset 0 1px 0 0 var(--hl);
  --e1:0 1px 1px rgba(var(--shade),.04), 0 2px 4px -1px rgba(var(--shade),.05);
  --e2:0 1px 2px rgba(var(--shade),.05), 0 4px 8px -2px rgba(var(--shade),.06), 0 10px 18px -6px rgba(var(--shade),.06);
  --e3:0 2px 4px rgba(var(--shade),.05), 0 8px 16px -4px rgba(var(--shade),.07), 0 20px 36px -10px rgba(var(--shade),.10);
  --e4:0 4px 8px rgba(var(--shade),.06), 0 16px 32px -8px rgba(var(--shade),.10), 0 40px 72px -20px rgba(var(--shade),.20);
  --e-brand:0 1px 2px rgba(0,119,238,.30), 0 6px 14px -4px rgba(0,119,238,.42), 0 16px 32px -12px rgba(0,119,238,.44);
  --focus:0 0 0 4px rgba(0,119,238,.20);

  /* ---- geometry ---- */
  --r1:8px; --r2:12px; --r3:16px; --r4:20px; --r5:28px; --rf:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --s8:32px; --s10:40px; --s12:48px; --s16:64px; --s20:80px;

  /* ---- type ---- */
  --disp:'Alexandria','Dubai','Segoe UI',system-ui,sans-serif;
  --body:'PlexAr','Dubai','Segoe UI',system-ui,sans-serif;

  /* ---- motion ---- */
  --ease:cubic-bezier(.2,.8,.3,1);
  --ease-io:cubic-bezier(.4,0,.2,1);
  --dur:.24s; --dur-l:.4s;

  /* ---- layout ---- */
  --maxw:1180px; --gut:clamp(1.1rem,4vw,2.75rem); --sec:clamp(3.5rem,8vw,6.5rem);

  --sky:radial-gradient(56% 40% at 16% 4%, rgba(61,155,255,.28), transparent 62%),
        radial-gradient(46% 36% at 84% 0%, rgba(0,180,240,.22), transparent 62%),
        radial-gradient(84% 56% at 50% -10%, rgba(176,214,255,.40), transparent 70%),
        linear-gradient(180deg,#E4F1FE 0%, #F1F8FD 52%, #F0F6FC 100%);
}

        radial-gradient(46% 36% at 84% 0%, rgba(0,180,240,.22), transparent 62%),
        radial-gradient(84% 56% at 50% -10%, rgba(176,214,255,.40), transparent 70%),
        linear-gradient(180deg,#E4F1FE 0%, #F1F8FD 52%, #F0F6FC 100%);
}

/* ============ base ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
  font-size:1rem;line-height:1.8;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
p{margin:0}
::selection{background:var(--brand);color:#fff}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r2)}

/* ============ type scale ============ */
.t-display,.t-h1,.t-h2,.t-h3,.t-h4{font-family:var(--disp);margin:0;text-wrap:balance}
.t-display{font-size:clamp(1.85rem,4.1vw,3.15rem);font-weight:700;letter-spacing:-.028em;line-height:1.1}
.t-h1{font-size:clamp(2rem,4.4vw,3.3rem);font-weight:700;letter-spacing:-.024em;line-height:1.14}
.t-h2{font-size:clamp(1.55rem,3vw,2.35rem);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.t-h3{font-size:1.06rem;font-weight:600;letter-spacing:-.008em;line-height:1.45}
.t-h4{font-size:.93rem;font-weight:600;line-height:1.45}
:root[dir="rtl"] .t-display{letter-spacing:0;line-height:1.3}
:root[dir="rtl"] .t-h1{letter-spacing:0;line-height:1.34}
:root[dir="rtl"] .t-h2{letter-spacing:0;line-height:1.42}
:root[dir="rtl"] .t-h3,:root[dir="rtl"] .t-h4{letter-spacing:0;line-height:1.6}
.t-lead{font-size:clamp(.98rem,1.2vw,1.1rem);line-height:1.85;color:var(--ink-2);max-width:58ch;margin:0}
.t-body{font-size:.92rem;line-height:1.8;color:var(--ink-2)}
.t-sm{font-size:.85rem;line-height:1.7;color:var(--ink-2)}
.t-cap{font-size:.76rem;line-height:1.6;color:var(--ink-3)}
.t-label{font-size:.78rem;font-weight:600;color:var(--ink-2);line-height:1.5}
.num{font-variant-numeric:tabular-nums}
.grad-txt{background:var(--surf-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.em{color:var(--brand)}

/* ============ layout ============ */
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gut)}
.sec{padding-block:var(--sec)}
.sec-t{padding-block:0 var(--sec)}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.g1{gap:var(--s1)}.g2{gap:var(--s2)}.g3{gap:var(--s3)}.g4{gap:var(--s4)}
.g5{gap:var(--s5)}.g6{gap:var(--s6)}.g8{gap:var(--s8)}.g10{gap:var(--s10)}
.ctr{align-items:center;text-align:center}
.ctr .t-lead{margin-inline:auto}
.wrapf{flex-wrap:wrap}

/* ============ surface primitive ============ */
.surface{
  background:var(--surf-1);border-radius:var(--r4);
  box-shadow:var(--ring), var(--hi), var(--e1);
  transition:box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.surface-2{background:var(--surf-2)}
.surface-sunk{background:var(--surf-3);box-shadow:var(--ring), inset 0 1px 2px rgba(var(--shade),.05)}
.lift:hover{transform:translateY(-4px);box-shadow:var(--ring-2), var(--hi), var(--e3)}
.e2{box-shadow:var(--ring), var(--hi), var(--e2)}
.e3{box-shadow:var(--ring), var(--hi), var(--e3)}
.e4{box-shadow:var(--ring), var(--hi), var(--e4)}

/* ============ buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  padding:.78rem 1.5rem;border-radius:var(--rf);font-weight:600;font-size:.92rem;
  line-height:1.2;white-space:nowrap;position:relative;
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
             background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.btn:active{transform:translateY(1px) scale(.995)}
.btn-lg{padding:.95rem 1.85rem;font-size:.98rem}
.btn-sm{padding:.55rem 1.05rem;font-size:.83rem}

.btn-p{background:var(--surf-btn);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(0,0,0,.10), var(--e-brand)}
.btn-p:hover{transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34), 0 2px 4px rgba(0,119,238,.3), 0 10px 22px -4px rgba(0,119,238,.5), 0 24px 44px -14px rgba(0,119,238,.5)}

.btn-s{background:var(--surf-1);color:var(--ink);
  box-shadow:var(--ring-2), var(--hi), var(--e1)}
.btn-s:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line-3), var(--hi), var(--e2)}

.btn-d{background:linear-gradient(180deg,#2A2A48 0%,#052659 100%);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), var(--e2)}
.btn-d:hover{transform:translateY(-2px);background:var(--surf-btn);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), var(--e-brand)}
:root[data-theme="dark"] .btn-d{background:linear-gradient(180deg,#2E2E52 0%,#1B1B38 100%)}

.btn-w{background:linear-gradient(180deg,#FFFFFF,#F4F4FA);color:var(--brand-lo);
  box-shadow:inset 0 1px 0 #fff, 0 2px 6px rgba(0,0,0,.14), 0 10px 24px -8px rgba(0,0,0,.3)}
.btn-w:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 #fff, 0 4px 10px rgba(0,0,0,.18), 0 16px 34px -10px rgba(0,0,0,.4)}

.btn-o{color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.btn-o:hover{background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);transform:translateY(-2px)}

.btn-ghost{color:var(--ink-2);padding-inline:var(--s3)}
.btn-ghost:hover{color:var(--brand);background:var(--brand-tint)}

.ar{flex:none;transition:transform var(--dur) var(--ease)}
:root[dir="rtl"] .ar{transform:scaleX(-1)}
:root[dir="rtl"] .btn:hover .ar{transform:scaleX(-1) translateX(3px)}
:root[dir="ltr"] .btn:hover .ar{transform:translateX(3px)}

/* ============ icon containers ============ */
.ico{display:grid;place-items:center;flex:none;border-radius:var(--r2);
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease)}
.ico-sm{width:28px;height:28px;border-radius:var(--r1)}
.ico-sm svg{width:14px;height:14px}
.ico-md{width:38px;height:38px}
.ico-md svg{width:19px;height:19px}
.ico-lg{width:48px;height:48px;border-radius:var(--r3)}
.ico-lg svg{width:23px;height:23px}
.ico-tint{background:var(--brand-tint);color:var(--brand);box-shadow:0 0 0 1px var(--brand-tint-2)}
.ico-solid{background:var(--surf-btn);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), var(--e-brand)}
.ico-neutral{background:var(--surf-2);color:var(--ink-2);box-shadow:var(--ring), var(--hi)}
.ico-glass{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.ico-mint{background:var(--mint-tint);color:var(--mint)}
.ico-amber{background:var(--amber-tint);color:var(--amber)}

/* ============ badges & chips ============ */
.badge{display:inline-flex;align-items:center;gap:var(--s2);padding:.4rem .85rem;
  border-radius:var(--rf);font-size:.79rem;font-weight:600;color:var(--ink-2);
  background:var(--surf-1);box-shadow:var(--ring-2), var(--hi), var(--e1)}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none}
.badge-brand{background:var(--brand-tint);color:var(--brand-d);box-shadow:0 0 0 1px var(--brand-tint-2)}
.badge-mint{background:var(--mint-tint);color:var(--mint);box-shadow:none}
.badge-mint i{background:var(--mint)}
.badge-glass{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.badge-glass i{background:#fff}

.chip{display:inline-flex;align-items:center;gap:var(--s2);padding:.5rem .9rem;
  border-radius:var(--r2);font-size:.86rem;font-weight:500;background:var(--surf-1);
  box-shadow:var(--ring), var(--hi), var(--e1);
  transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease)}
.chip:hover{transform:translateY(-2px);box-shadow:var(--ring-2), var(--hi), var(--e2)}
.chip svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.chip-key{background:var(--brand-tint);color:var(--brand-d);box-shadow:0 0 0 1px var(--brand-tint-2)}
.chip-key svg{color:var(--brand)}
.chip-xs{padding:.22rem .5rem;border-radius:var(--r1);font-size:.68rem;font-weight:600;box-shadow:var(--ring)}
.chip-xs svg{width:11px;height:11px}
.chip-xs.g{background:var(--mint-tint);color:var(--mint);box-shadow:none}
.chip-xs.v{background:var(--brand-tint);color:var(--brand-d);box-shadow:none}
.chip-xs.a{background:var(--amber-tint);color:var(--amber);box-shadow:none}

/* ============ inputs ============ */
.field{display:flex;flex-direction:column;gap:var(--s2)}
.field label{font-size:.79rem;font-weight:600;color:var(--ink-2)}
.input{font:inherit;font-size:.92rem;padding:.72rem .9rem;width:100%;color:var(--ink);
  background:var(--surf-2);border:0;border-radius:var(--r2);
  box-shadow:var(--ring-2), inset 0 1px 2px rgba(var(--shade),.04);
  transition:box-shadow var(--dur) var(--ease), background var(--dur) var(--ease)}
.input::placeholder{color:var(--ink-4)}
.input:hover{box-shadow:0 0 0 1px var(--line-3), inset 0 1px 2px rgba(var(--shade),.04)}
.input:focus{outline:none;background:var(--bg);
  box-shadow:0 0 0 1px var(--brand), var(--focus)}
textarea.input{resize:vertical;min-height:118px;line-height:1.7}
select.input{cursor:pointer}

/* ============ divider ============ */
.hr{height:1px;border:0;margin:0;background:linear-gradient(90deg,transparent,var(--line-2) 12%,var(--line-2) 88%,transparent)}

/* ============ reveal ============ */
.rv{opacity:0;transform:translateY(18px);
  transition:opacity .7s var(--ease), transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.06s}.d2{transition-delay:.12s}.d3{transition-delay:.18s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
  .rv{opacity:1;transform:none}
}

/* ============ header ============ */
/* The floating pill is defined in the navbar stylesheet. What used to
   live here — a full-width translucent bar with backdrop-filter — is
   gone: on a position:fixed header that filter expands the backdrop
   root and paints a band across the whole width on scroll. */
.hdr-in{display:flex;align-items:center;gap:var(--s4)}
.brand{display:flex;align-items:center;gap:var(--s3);font-family:var(--disp);
  font-size:1.22rem;font-weight:700;flex:none;letter-spacing:-.01em}
.bmk{width:34px;height:34px;border-radius:11px;background:var(--surf-btn);display:grid;
  place-items:center;color:#fff;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), var(--e-brand)}
.bmk svg{width:18px;height:18px}
.navwrap{margin-inline:auto;display:flex}
.hdr .wrap{position:relative}
.nav{display:flex;gap:2px;background:var(--surf-2);padding:5px;border-radius:var(--rf);
  box-shadow:var(--ring), inset 0 1px 2px rgba(var(--shade),.04)}
.nav a{font-size:.87rem;font-weight:500;color:var(--ink-2);padding:.46rem .95rem;
  border-radius:var(--rf);transition:all var(--dur) var(--ease)}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--surf-1);color:var(--ink);box-shadow:var(--ring), var(--hi), var(--e1)}
.hdr-act{display:flex;align-items:center;gap:var(--s2);flex:none}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r2);
  color:var(--ink-2);transition:all var(--dur) var(--ease)}
.ibtn:hover{background:var(--surf-2);color:var(--ink);box-shadow:var(--ring)}
.lang{font-size:.78rem;font-weight:600;padding:.42rem .68rem;border-radius:var(--r2);
  color:var(--ink-2);box-shadow:var(--ring-2);transition:all var(--dur) var(--ease)}
.lang:hover{color:var(--brand-d);background:var(--brand-tint);box-shadow:0 0 0 1px var(--brand-tint-2)}
.burger{display:none}

/* ============ hero ============ */
.hero{position:relative;background:var(--sky);overflow:hidden;
  margin-top:calc(-1 * var(--nav-h));   /* cancels main padding-top */
  padding-block:calc(var(--nav-h) + clamp(.4rem,1.1vw,.9rem)) 0}
.hero::after{content:"";position:absolute;inset-inline:0;bottom:0;height:200px;
  background:linear-gradient(180deg,transparent,var(--bg));pointer-events:none;z-index:1}
.hero-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:var(--s5);margin-top:calc(-1 * clamp(112px,12vw,182px))}
.cta-row{display:flex;flex-wrap:wrap;gap:var(--s3);justify-content:center}

/* ============ app window ============ */
.shot{position:relative;z-index:2;margin-top:clamp(1rem,2vw,1.8rem);padding-bottom:clamp(1rem,3vw,2.5rem)}
.fpill{position:absolute;z-index:5;display:flex;align-items:center;gap:var(--s2);
  background:var(--surf-1);border-radius:var(--rf);padding:.45rem .85rem;
  box-shadow:var(--ring-2), var(--hi), var(--e3);
  font-size:.78rem;font-weight:600;white-space:nowrap;animation:bob 7s ease-in-out infinite}
.fpill svg{width:14px;height:14px;flex:none;color:var(--brand)}
.fp1{top:5%;inset-inline-start:-1%;animation-delay:0s}
.fp2{top:19%;inset-inline-end:-2%;animation-delay:1.4s}
.fp3{bottom:27%;inset-inline-start:-3%;animation-delay:2.8s}
.fp4{bottom:12%;inset-inline-end:1%;animation-delay:4.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

.win{background:var(--surf-1);border-radius:var(--r5);overflow:hidden;
  box-shadow:var(--ring-2), var(--hi), var(--e4)}
.win-bar{display:flex;align-items:center;gap:var(--s3);padding:.7rem 1rem;
  background:var(--surf-2);box-shadow:0 1px 0 var(--line)}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line-3)}
.url{flex:1;max-width:250px;margin-inline:auto;background:var(--surf-1);border-radius:var(--r1);
  font-size:.7rem;color:var(--ink-3);padding:.24rem .7rem;text-align:center;box-shadow:var(--ring)}
.app{display:grid;grid-template-columns:214px 1fr 248px;min-height:396px}

.asb{background:var(--surf-2);display:flex;flex-direction:column;padding:var(--s2);
  box-shadow:inset -1px 0 0 var(--line)}
:root[dir="rtl"] .asb{box-shadow:inset 1px 0 0 var(--line)}
.asb-h{display:flex;align-items:center;gap:var(--s2);padding:.45rem .55rem .7rem;
  font-size:.83rem;font-weight:700;font-family:var(--disp)}
.asb-h svg{width:16px;height:16px;color:var(--ink-3)}
.cnt{margin-inline-start:auto;background:var(--surf-btn);color:#fff;font-size:.64rem;
  font-weight:700;min-width:20px;height:20px;border-radius:var(--rf);display:grid;
  place-items:center;padding-inline:.32rem;box-shadow:var(--e-brand)}
.cv{display:flex;gap:var(--s3);padding:.55rem;border-radius:var(--r2);align-items:flex-start;
  transition:all var(--dur) var(--ease)}
.cv.on{background:var(--surf-1);box-shadow:var(--ring), var(--hi), var(--e1)}
.cv-av{width:32px;height:32px;border-radius:var(--r1);flex:none;display:grid;place-items:center;
  font-size:.72rem;font-weight:700;color:#fff;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.cv-ch{position:absolute;inset-block-end:-3px;inset-inline-end:-3px;width:15px;height:15px;
  border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg-sunk)}
.cv.on .cv-ch{box-shadow:0 0 0 2px var(--bg)}
.cv-ch svg{width:8px;height:8px;color:#fff}
.cv-t{min-width:0;display:flex;flex-direction:column}
.cv-n{font-size:.79rem;font-weight:600;line-height:1.45}
.cv-p{font-size:.72rem;color:var(--ink-3);line-height:1.45;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:106px}
.cv-time{margin-inline-start:auto;font-size:.63rem;color:var(--ink-4);flex:none}

.thr{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.thr-h{padding:.75rem 1rem;display:flex;align-items:center;gap:var(--s3);box-shadow:0 1px 0 var(--line)}
.thr-b{flex:1;padding:1rem;display:flex;flex-direction:column;gap:var(--s3);overflow:hidden}
.msg{max-width:86%;animation:rise .5s var(--ease) both}
.msg.them{align-self:flex-start}
.msg.us{align-self:flex-end}
.bub{padding:.62rem .9rem;border-radius:var(--r3);font-size:.85rem;line-height:1.65;display:block}
.msg.them .bub{background:var(--surf-3);border-end-start-radius:5px;box-shadow:var(--ring)}
.msg.us .bub{background:var(--surf-btn);color:#fff;border-end-end-radius:5px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24), var(--e-brand)}
.mmeta{display:flex;align-items:center;gap:var(--s1);font-size:.64rem;color:var(--ink-3);
  margin-top:.28rem;padding-inline:.28rem}
.mmeta svg{width:11px;height:11px;color:var(--brand)}
.msg.us .mmeta{justify-content:flex-end}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.typ{display:inline-flex;gap:.26rem;padding:.75rem .9rem;background:var(--surf-3);
  border-radius:var(--r3);border-end-start-radius:5px;box-shadow:var(--ring)}
.typ i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);animation:bl 1.3s infinite}
.typ i:nth-child(2){animation-delay:.18s}.typ i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.pc{background:var(--surf-1);border-radius:var(--r3);padding:.55rem;display:flex;gap:var(--s3);
  align-items:center;min-width:214px;box-shadow:var(--ring-2), var(--hi), var(--e2)}
.pc-i{width:44px;height:50px;border-radius:var(--r1);flex:none;background:var(--surf-brand);
  position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.pc-i::after{content:"";position:absolute;inset:26% 26% 6%;border-radius:44% 44% 8% 8%;
  background:rgba(255,255,255,.42)}
.pc-n{font-size:.79rem;font-weight:600;line-height:1.4}
.pc-p{font-size:.73rem;color:var(--ink-2)}
.thr-f{padding:.65rem 1rem;display:flex;align-items:center;gap:var(--s3);box-shadow:0 -1px 0 var(--line)}
.fi{flex:1;background:var(--surf-2);border-radius:var(--rf);padding:.48rem .9rem;
  font-size:.76rem;color:var(--ink-4);box-shadow:var(--ring), inset 0 1px 2px rgba(var(--shade),.04)}
.sb{width:31px;height:31px;border-radius:50%;background:var(--surf-btn);display:grid;
  place-items:center;flex:none;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3), var(--e-brand)}
.sb svg{width:14px;height:14px}

.apn{background:var(--surf-2);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);
  box-shadow:inset 1px 0 0 var(--line)}
:root[dir="rtl"] .apn{box-shadow:inset -1px 0 0 var(--line)}
.apn-h{font-size:.78rem;font-weight:700;font-family:var(--disp)}
.pn{background:var(--surf-1);border-radius:var(--r2);padding:.7rem;display:flex;
  flex-direction:column;gap:var(--s2);box-shadow:var(--ring), var(--hi), var(--e1)}
.pn-k{font-size:.68rem;color:var(--ink-3)}
.pn-v{font-size:.88rem;font-weight:700}
.meter{height:6px;border-radius:var(--rf);background:var(--surf-3);overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(var(--shade),.08)}
.meter i{display:block;height:100%;border-radius:var(--rf);background:var(--surf-btn);
  box-shadow:0 0 8px rgba(0,119,238,.5)}

/* ============ strip ============ */
.strip{display:flex;align-items:center;gap:clamp(1rem,4vw,2.4rem);flex-wrap:wrap;
  justify-content:center;padding:var(--s6) clamp(1rem,3vw,2rem);background:var(--surf-2);
  border-radius:var(--r4);box-shadow:var(--ring), var(--hi)}
.strip-l{font-size:.81rem;color:var(--ink-3);max-width:16ch;line-height:1.55;flex:none;text-align:start}
.strip-row{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(.8rem,3vw,2rem);justify-content:center}
.lg{display:flex;align-items:center;gap:var(--s2);color:var(--ink-3);font-weight:600;
  font-size:.93rem;transition:all var(--dur) var(--ease)}
.lg svg{width:19px;height:19px}
.lg:hover{color:var(--ink);transform:translateY(-2px)}

/* ============ grids ============ */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s3)}

/* ============ feature card ============ */
.fc{padding:var(--s6);display:flex;flex-direction:column;gap:var(--s2);overflow:hidden;position:relative}
.fc-ui{margin-top:var(--s4);border-radius:var(--r3);background:var(--surf-2);padding:var(--s3);
  display:flex;flex-direction:column;gap:var(--s2);box-shadow:var(--ring), inset 0 1px 2px rgba(var(--shade),.04)}
.fc-on{background:var(--surf-brand);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), var(--e-brand)}
.fc-on .t-body,.fc-on .t-sm{color:rgba(255,255,255,.84)}
.fc-on .fc-ui{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.fc-on .mrow{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.fc-on .mk,.fc-on .mv{color:#fff}
.fc-on .mmut{color:rgba(255,255,255,.72)}
.fc-on .chip-xs{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.fc-on .chip-xs.v{background:#fff;color:var(--brand-lo)}
.fc-on:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.26), 0 4px 8px rgba(0,119,238,.3), 0 20px 44px -12px rgba(0,119,238,.6)}

/* mini-ui atoms */
.mrow{display:flex;align-items:center;gap:var(--s2);background:var(--surf-1);
  border-radius:var(--r2);padding:.5rem .6rem;box-shadow:var(--ring), var(--hi)}
.mav{width:26px;height:26px;border-radius:var(--r1);flex:none;display:grid;place-items:center;
  font-size:.63rem;font-weight:700;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.mav svg{width:13px;height:13px}
.mk{font-size:.75rem;font-weight:600;line-height:1.4}
.mmut{font-size:.7rem;color:var(--ink-3);line-height:1.4}
.mv{font-size:.78rem;font-weight:700;margin-inline-start:auto;flex:none}
.mbub{font-size:.74rem;line-height:1.6;padding:.42rem .65rem;border-radius:var(--r2);max-width:88%}
.mbub.them{background:var(--surf-3);align-self:flex-start;border-end-start-radius:4px;box-shadow:var(--ring)}
.mbub.us{background:var(--surf-btn);color:#fff;align-self:flex-end;border-end-end-radius:4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.fc-on .mbub.them{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.fc-on .mbub.us{background:#fff;color:var(--brand-lo)}
.mbars{display:flex;align-items:flex-end;gap:6px;height:58px}
.mbars i{flex:1;border-radius:5px 5px 3px 3px;background:var(--surf-3);box-shadow:var(--ring)}
.mbars i.hi{background:var(--surf-btn);box-shadow:var(--e-brand)}
.fc-on .mbars i{background:rgba(255,255,255,.24);box-shadow:none}
.fc-on .mbars i.hi{background:#fff}
.mtl{display:flex;flex-direction:column;gap:var(--s2)}
.mtl-r{display:flex;align-items:center;gap:var(--s2);font-size:.73rem;color:var(--ink-2)}
.mtl-d{width:9px;height:9px;border-radius:50%;flex:none;background:var(--bg);
  box-shadow:0 0 0 2px var(--line-3)}
.mtl-r.ok .mtl-d{background:var(--mint);box-shadow:0 0 0 2px var(--mint)}
.mtl-r.now .mtl-d{background:var(--brand);box-shadow:0 0 0 2px var(--brand), 0 0 0 5px var(--brand-tint)}
.mtl-r.now{color:var(--ink);font-weight:600}
.fc-on .mtl-r{color:rgba(255,255,255,.8)}
.fc-on .mtl-r.now{color:#fff}
.fc-on .mtl-d{background:transparent;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.fc-on .mtl-r.ok .mtl-d,.fc-on .mtl-r.now .mtl-d{background:#fff;box-shadow:0 0 0 2px #fff}

/* ============ stat tile ============ */
.st{padding:var(--s6);display:flex;flex-direction:column;gap:var(--s1);position:relative;min-height:158px}
.st-ic{position:absolute;top:var(--s5);inset-inline-end:var(--s5)}
.st-v{font-family:var(--disp);font-size:clamp(1.8rem,3vw,2.5rem);font-weight:700;
  line-height:1.1;letter-spacing:-.02em}
.st-l{font-size:.84rem;color:var(--ink-2);line-height:1.6;margin-top:auto}

/* ============ steps ============ */
.stepwrap{display:grid;grid-template-columns:.95fr 1.05fr;gap:clamp(1.2rem,3vw,2rem);align-items:center}
.stepshot{background:var(--surf-brand);border-radius:var(--r5);padding:clamp(1.2rem,3vw,2rem);
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24), var(--e-brand)}
.stepshot::before{content:"";position:absolute;inset:0;
  background:radial-gradient(70% 60% at 50% 0%,rgba(255,255,255,.26),transparent 65%)}
.stepshot .win{position:relative;z-index:1;border-radius:var(--r4)}
.steplist{display:flex;flex-direction:column;gap:var(--s3)}
.sp{padding:var(--s5) var(--s6);display:flex;gap:var(--s4);align-items:flex-start}
.sp-n{width:34px;height:34px;border-radius:var(--r2);background:var(--surf-btn);color:#fff;
  display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:.83rem;
  flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.3), var(--e-brand)}
.sp-m{font-size:.74rem;color:var(--brand);font-weight:600;margin-top:.25rem}

/* ============ pricing ============ */
.pl{padding:var(--s6) var(--s5);display:flex;flex-direction:column;gap:var(--s4);position:relative}
.pl-on{background:var(--surf-brand);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), var(--e-brand)}
.pl-on:hover{transform:translateY(-4px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.26), 0 20px 46px -12px rgba(0,119,238,.62)}
.pl-flag{position:absolute;top:var(--s6);inset-inline-end:var(--s5)}
.pl-n{font-family:var(--disp);font-size:1.05rem;font-weight:700}
.pl-for{font-size:.83rem;color:var(--ink-2);line-height:1.65;min-height:3.3em}
.pl-on .pl-for{color:rgba(255,255,255,.84)}
.pl-pr{display:flex;align-items:baseline;gap:.2rem;font-family:var(--disp)}
.pl-c{font-size:1rem;font-weight:600;opacity:.7}
.pl-a{font-size:2.25rem;font-weight:700;line-height:1;letter-spacing:-.025em}
.pl-per{font-size:.77rem;font-family:var(--body);font-weight:400;opacity:.65}
.pl ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s3);font-size:.85rem}
.pl li{display:flex;gap:var(--s2);align-items:flex-start;color:var(--ink-2);line-height:1.6}
.pl-on li{color:rgba(255,255,255,.9)}
.tick{width:18px;height:18px;border-radius:50%;background:var(--brand-tint);flex:none;
  margin-top:.22rem;display:grid;place-items:center}
.tick svg{width:10px;height:10px;color:var(--brand);stroke-width:3.2}
.pl-on .tick{background:rgba(255,255,255,.22)}
.pl-on .tick svg{color:#fff}
.pl .btn{margin-top:auto;width:100%}

/* ============ faq ============ */
.faq{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);align-items:start}
.qa{overflow:hidden;transition:box-shadow var(--dur) var(--ease)}
.qa[open]{box-shadow:0 0 0 1px var(--brand-tint-2), var(--hi), var(--e2)}
.qa summary{display:flex;align-items:center;gap:var(--s4);padding:var(--s5) var(--s5);
  cursor:pointer;font-weight:600;font-size:.9rem;list-style:none;line-height:1.6}
.qa summary::-webkit-details-marker{display:none}
.qa-i{margin-inline-start:auto;width:24px;height:24px;border-radius:50%;background:var(--surf-3);
  display:grid;place-items:center;flex:none;font-size:1rem;color:var(--ink-2);line-height:1;
  transition:all var(--dur) var(--ease);box-shadow:var(--ring)}
.qa[open] .qa-i{transform:rotate(45deg);background:var(--surf-btn);color:#fff;
  box-shadow:var(--e-brand)}
.qa-a{padding:0 var(--s5) var(--s5);color:var(--ink-2);font-size:.87rem;line-height:1.85}

/* ============ integration card ============ */
.it{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.it-h{display:flex;align-items:center;gap:var(--s3)}
.it-n{font-family:var(--disp);font-size:.99rem;font-weight:700}
.it-s{margin-top:auto;padding-top:var(--s2);font-size:.73rem;font-weight:600;display:flex;
  align-items:center;gap:var(--s2);color:var(--mint)}
.it-s.soon{color:var(--ink-3)}
.it-s i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent)}

/* ============ slots + note ============ */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4)}
.slot{border-radius:var(--r4);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);
  min-height:170px;background:var(--surf-2);box-shadow:0 0 0 1.5px var(--line-2)}
.slot-q{font-family:var(--disp);font-size:1.6rem;color:var(--ink-4);opacity:.5}
.slot-w{margin-top:auto;display:flex;align-items:center;gap:var(--s3)}
.slot-av{width:36px;height:36px;border-radius:50%;background:var(--surf-3);flex:none;box-shadow:var(--ring)}
.slot-b{height:8px;border-radius:var(--rf);background:var(--surf-3)}
.note{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4) var(--s5);
  border-radius:var(--r3);background:var(--brand-tint);font-size:.84rem;color:var(--ink-2);
  line-height:1.7;box-shadow:0 0 0 1px var(--brand-tint-2)}
.note svg{width:17px;height:17px;color:var(--brand);flex:none;margin-top:.28rem}

/* ============ cta band ============ */
.band{position:relative;border-radius:var(--r5);padding:clamp(2.2rem,5.5vw,4rem) clamp(1.4rem,4vw,3rem);
  background:var(--surf-brand);color:#fff;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24), var(--e-brand);
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s5)}
.band::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 100% at 50% 0%,rgba(255,255,255,.3),transparent 62%)}
.band::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.8) 1px,transparent 0);
  background-size:22px 22px;
  -webkit-mask-image:radial-gradient(62% 72% at 50% 50%,#000,transparent 76%);
  mask-image:radial-gradient(62% 72% at 50% 50%,#000,transparent 76%)}
.band>*{position:relative;z-index:1}
.band .t-h2{color:#fff}
.band p{color:rgba(255,255,255,.86);max-width:52ch;font-size:1rem;line-height:1.8;margin-inline:auto}

/* ============ contact ============ */
.ctwo{display:grid;grid-template-columns:1.35fr .65fr;gap:clamp(1.2rem,3vw,2.2rem);align-items:start}
.form{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);padding:clamp(1.3rem,3vw,1.9rem)}
.field.full{grid-column:1/-1}
.cside{display:flex;flex-direction:column;gap:var(--s3)}
.cb{padding:var(--s5);display:flex;gap:var(--s3);align-items:flex-start}
.cb-k{font-size:.74rem;color:var(--ink-3)}
.cb-v{font-weight:600;font-size:.9rem}

/* ============ footer ============ */
.ftr{background:var(--surf-2);box-shadow:0 -1px 0 var(--line);
  padding-block:clamp(2.4rem,5vw,3.5rem) 1.5rem;margin-top:var(--sec)}
.ftr-g{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:clamp(1.4rem,4vw,2.8rem)}
.fcol{display:flex;flex-direction:column;gap:var(--s2)}
.fh{font-size:.78rem;font-weight:700;color:var(--ink);margin-bottom:var(--s1)}
.fcol a{font-size:.87rem;color:var(--ink-2);transition:color var(--dur) var(--ease)}
.fcol a:hover{color:var(--brand)}
.ftr-b{display:flex;flex-wrap:wrap;gap:var(--s4);justify-content:space-between;align-items:center;
  margin-top:clamp(1.8rem,4vw,2.6rem);padding-top:var(--s5);
  box-shadow:inset 0 1px 0 var(--line);font-size:.81rem;color:var(--ink-3)}
.bdgs{display:flex;gap:var(--s2);flex-wrap:wrap}

/* ============ design-system page ============ */
.ds-sec{display:flex;flex-direction:column;gap:var(--s5)}
.ds-h{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.ds-h code{font-size:.74rem;color:var(--ink-3);background:var(--surf-3);padding:.15rem .5rem;
  border-radius:var(--r1);box-shadow:var(--ring)}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:var(--s3)}
.sw{border-radius:var(--r3);overflow:hidden;box-shadow:var(--ring), var(--hi), var(--e1)}
.sw-c{height:66px}
.sw-t{padding:.55rem .7rem;background:var(--surf-1);display:flex;flex-direction:column}
.sw-n{font-size:.75rem;font-weight:600}
.sw-v{font-size:.66rem;color:var(--ink-3)}
.ds-row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.ds-box{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.el-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s5)}
.el{height:92px;border-radius:var(--r3);background:var(--surf-1);display:grid;place-items:center;
  font-size:.73rem;color:var(--ink-3);font-weight:600}
.rad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:var(--s3)}
.rad{height:74px;background:var(--surf-2);display:grid;place-items:center;font-size:.72rem;
  color:var(--ink-3);font-weight:600;box-shadow:var(--ring)}
.ty-row{display:flex;align-items:baseline;gap:var(--s5);padding-block:var(--s3);
  box-shadow:inset 0 -1px 0 var(--line);flex-wrap:wrap}
.ty-k{font-size:.7rem;color:var(--ink-3);min-width:88px;flex:none}

/* ============ responsive ============ */
@media (max-width:1080px){
  .app{grid-template-columns:196px 1fr}
  .apn{display:none}
  .stepwrap{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .ctwo{grid-template-columns:1fr}
  .ftr-g{grid-template-columns:1fr 1fr}
  .fp1,.fp3{inset-inline-start:1%}
  .fp2,.fp4{inset-inline-end:1%}
}
@media (max-width:860px){
  .navwrap{display:none;position:fixed;inset:72px 0 auto;margin:0}
  .navwrap.open{display:flex}
  .nav{flex-direction:column;width:100%;border-radius:0;padding:var(--s3) var(--gut) var(--s5);
    background:var(--bg);box-shadow:0 1px 0 var(--line), var(--e3)}
  .nav a{padding:.75rem .9rem;font-size:.98rem;text-align:start}
  .burger{display:grid}
  .app{grid-template-columns:1fr}
  .asb{display:none}
  .hdr-in{height:64px}
}
@media (max-width:700px){
  .grid4{grid-template-columns:1fr 1fr}
  .grid3,.grid2,.slots,.faq,.form{grid-template-columns:1fr}
  .fpill{display:none}
  .strip{flex-direction:column}
  .strip-l{text-align:center;max-width:none}
}

/* ============ ROI calculator ============ */
.calc{display:grid;grid-template-columns:1fr 1.05fr;gap:0;overflow:hidden}
.calc-in{padding:clamp(1.4rem,3vw,2.2rem);display:flex;flex-direction:column;gap:var(--s6)}
.calc-f{display:flex;flex-direction:column;gap:var(--s3)}
.calc-lab{display:flex;align-items:baseline;gap:var(--s2)}
.calc-lab>span:first-child{font-size:.86rem;font-weight:600}
.calc-val{margin-inline-start:auto;font-family:var(--disp);font-size:1.05rem;font-weight:700;
  color:var(--brand);font-variant-numeric:tabular-nums}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:var(--rf);
  background:var(--surf-3);box-shadow:inset 0 1px 2px rgba(var(--shade),.10);outline:none;cursor:pointer}
.rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;
  border-radius:50%;background:var(--surf-btn);cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 0 0 3px var(--bg), var(--e-brand);
  transition:transform var(--dur) var(--ease)}
.rng::-webkit-slider-thumb:hover{transform:scale(1.12)}
.rng::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--brand);
  cursor:pointer;box-shadow:0 0 0 3px var(--bg), var(--e-brand)}
.rng:focus-visible{box-shadow:inset 0 1px 2px rgba(var(--shade),.10), var(--focus)}
.calc-hint{font-size:.74rem;color:var(--ink-3)}
.calc-out{background:var(--surf-brand);color:#fff;padding:clamp(1.4rem,3vw,2.2rem);
  display:flex;flex-direction:column;gap:var(--s5);position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.calc-out::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(80% 70% at 50% 0%,rgba(255,255,255,.22),transparent 62%)}
.calc-out>*{position:relative;z-index:1}
.calc-hero{display:flex;flex-direction:column;gap:var(--s1)}
.calc-hero-k{font-size:.82rem;color:rgba(255,255,255,.8)}
.calc-hero-v{font-family:var(--disp);font-size:clamp(2rem,4.4vw,3rem);font-weight:700;
  line-height:1.05;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.calc-hero-v small{font-size:.4em;font-weight:600;opacity:.75;margin-inline-start:.35em;letter-spacing:0}
.calc-mini{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.calc-m{background:rgba(255,255,255,.13);border-radius:var(--r2);padding:var(--s4);
  display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.calc-m-k{font-size:.72rem;color:rgba(255,255,255,.78);line-height:1.5}
.calc-m-v{font-family:var(--disp);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.calc-split{height:10px;border-radius:var(--rf);background:rgba(255,255,255,.22);overflow:hidden;display:flex}
.calc-split i{display:block;height:100%;background:#fff;transition:width .5s var(--ease)}
.calc-legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:.74rem;color:rgba(255,255,255,.82)}
.calc-legend span{display:flex;align-items:center;gap:6px}
.calc-legend i{width:8px;height:8px;border-radius:50%;background:#fff;flex:none}
.calc-legend .dim i{background:rgba(255,255,255,.38)}
.calc-note{font-size:.72rem;color:rgba(255,255,255,.68);line-height:1.6}

/* ============ dialect demo ============ */
.dw{display:grid;grid-template-columns:1.18fr .82fr;gap:var(--s4);align-items:stretch}
.dbox{padding:clamp(1.2rem,2.6vw,1.8rem);display:flex;flex-direction:column;gap:var(--s4)}
.dtabs{display:flex;gap:6px;flex-wrap:wrap}
.dt{padding:.45rem .95rem;border-radius:var(--rf);font-size:.83rem;font-weight:600;
  color:var(--ink-2);background:var(--surf-2);box-shadow:var(--ring);
  transition:all var(--dur) var(--ease)}
.dt:hover{color:var(--ink)}
.dt.on{background:var(--surf-btn);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3), var(--e-brand)}
.dqs{display:flex;flex-wrap:wrap;gap:6px}
.dq{padding:.42rem .8rem;border-radius:var(--r2);font-size:.79rem;color:var(--ink-2);
  background:var(--surf-1);box-shadow:var(--ring), var(--hi);text-align:start;
  transition:all var(--dur) var(--ease)}
.dq:hover{color:var(--brand-d);background:var(--brand-tint);
  box-shadow:0 0 0 1px var(--brand-tint-2);transform:translateY(-2px)}
.dchat{background:var(--surf-2);border-radius:var(--r3);padding:var(--s4);min-height:190px;
  display:flex;flex-direction:column;gap:var(--s3);justify-content:center;
  box-shadow:var(--ring), inset 0 1px 2px rgba(var(--shade),.04)}
.dchat .msg{max-width:88%}
.dempty{font-size:.85rem;color:var(--ink-3);text-align:center;line-height:1.7}

.dsend{width:44px;height:44px;border-radius:50%;background:var(--surf-btn);color:#fff;flex:none;

/* ============ comparison table ============ */

   COLOUR — section bands + gradient-filled cards
   ============================================================ */

/* ---- full-bleed section bands ---- */
.sec-white{background:var(--bg-2);position:relative}
/* Radial layers rather than blurred pseudo-orbs — a blurred circle inside
   overflow:hidden gets clipped to a hard rectangle at the section edge. */
.sec-tint{position:relative;
  background:
    radial-gradient(44% 40% at 12% 4%, rgba(0,140,240,.22), transparent 64%),
    radial-gradient(40% 38% at 88% 96%, rgba(0,180,235,.20), transparent 64%),
    linear-gradient(180deg,#E4F1FE 0%,#DFEEFB 58%,#EAF4FC 100%)}
:root[data-theme="dark"] .sec-tint,
:root:not([data-theme="light"]) .sec-tint{
  background:
    radial-gradient(44% 40% at 12% 4%, rgba(10,100,200,.30), transparent 64%),
    radial-gradient(40% 38% at 88% 96%, rgba(0,120,180,.26), transparent 64%),
    linear-gradient(180deg,#04182E 0%,#051524 60%,#04101E 100%)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .sec-tint{
  background:
    radial-gradient(44% 40% at 12% 4%, rgba(0,140,240,.22), transparent 64%),
    radial-gradient(40% 38% at 88% 96%, rgba(0,180,235,.20), transparent 64%),
    linear-gradient(180deg,#E4F1FE 0%,#DFEEFB 58%,#EAF4FC 100%)}}
.sec-tint>*{position:relative;z-index:1}

.sec-dark{position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(180deg,#063B78 0%,#052A55 45%,#03121F 100%)}
.sec-dark::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;

    radial-gradient(1.5px 1.5px at 42% 62%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 86% 74%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 28% 86%,#fff,transparent)}

/* ============================================================
   HUB — animated two-way message flow diagram
   ============================================================ */
.hubwrap{position:relative;display:flex;flex-direction:column;gap:var(--s5);align-items:center}
.hub-svg{width:100%;height:auto;display:block;overflow:visible}

/* connector rails */
.hub-rail{fill:none;stroke:rgba(255,255,255,.15);stroke-width:1.5;
  stroke-linejoin:round;stroke-linecap:round}

/* travelling packets — one dash chasing along a normalised path */
.hub-flow{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:11 200}
.hub-in{stroke:var(--c);stroke-width:4;
  animation:flowIn var(--dur-cycle,3.4s) linear infinite;animation-delay:var(--d,0s)}
.hub-out{stroke:#FFFFFF;stroke-width:3;
  animation:flowOut var(--dur-cycle,3.4s) linear infinite;animation-delay:var(--d,0s)}
/* dash parked at -100 sits past the path end, at 11 before its start: both invisible */
@keyframes flowIn{0%{stroke-dashoffset:11}42%,100%{stroke-dashoffset:-100}}
@keyframes flowOut{0%,54%{stroke-dashoffset:-100}96%,100%{stroke-dashoffset:11}}

/* channel nodes */
.hub-node .glyph{filter:drop-shadow(0 0 12px var(--c)) drop-shadow(0 3px 8px rgba(0,0,0,.55))}
.hub-node .halo{fill:var(--c);opacity:.22;
  animation:halo var(--dur-cycle,3.4s) ease-out infinite;animation-delay:var(--d,0s);
  transform-box:fill-box;transform-origin:center}
@keyframes halo{0%{transform:scale(.9);opacity:.5}34%,100%{transform:scale(1.9);opacity:0}}
.hub-node .lab{fill:rgba(255,255,255,.82);font-family:var(--body);font-size:19px;
  font-weight:600;text-anchor:middle}
.hub-node .sub{fill:rgba(255,255,255,.4);font-family:var(--body);font-size:15px;text-anchor:middle}

/* hub core */
.hub-core circle.disc{fill:#FFFFFF}
.hub-ring{fill:none;stroke:rgba(150,205,255,.5);stroke-width:1.5;
  transform-box:fill-box;transform-origin:center;
  animation:hubring var(--dur-cycle,3.4s) ease-out infinite}
.hub-ring.r2{animation-delay:.5s}
.hub-ring.r3{animation-delay:1s}
@keyframes hubring{0%{transform:scale(1);opacity:.55}75%,100%{transform:scale(2.05);opacity:0}}
.hub-glow{fill:url(#hubGlow);opacity:.85}

/* latency chip under the hub */
.hub-chip{fill:rgba(255,255,255,.12);stroke:rgba(255,255,255,.24);stroke-width:1}
.hub-chip-t{fill:#FFFFFF;font-family:var(--body);font-size:17px;font-weight:600;text-anchor:middle}


@media (prefers-reduced-motion:reduce){
  .hub-in,.hub-out,.hub-ring,.hub-node .halo{animation:none}
  .hub-in,.hub-out{stroke-dasharray:none;opacity:.55}
  .hub-node .halo{opacity:.22}
}

/* ============================================================
   HERO FLOW — questions converge on the logo, shrink until they
   fit behind it, and vanish under it. Answers grow back out.

   Position and scale live on TWO elements:
     .fs-chip  — travel only, one continuous ease
     .fs-body  — scale / opacity only, on its own curve
   Sharing a single timing function forced the two to fight, which
   is what produced the speed jump at the logo. Split, the chip can
   glide to a standstill at the throat and the answer can leave from
   that same standstill — velocity is zero on both sides, so the
   hand-off is seamless.

   One 24s cycle per lane: question owns 0–50%, answer 50–100%.
   Twelve lanes 2s apart, all travelling right to left, phased with negative delays so all of them
   are already in flight on load.
   Uniform scale only — nothing is stretched or distorted.
   ============================================================ */
.fs{position:relative;contain:layout paint style;height:clamp(300px,29vw,392px);margin-block:clamp(18px,2.6vw,34px) clamp(.9rem,2vw,1.5rem);
  width:100vw;margin-inline-start:calc(50% - 50vw);
  z-index:2;--fsL:clamp(56px,5.9vw,70px);--fsY:19%;}


/* ---- disc + concentric rings, matching the hub diagram ---- */
.fs-glow{position:absolute;left:50%;top:var(--fsY);z-index:1;
  width:calc(var(--fsL) * 1.34);aspect-ratio:1;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;
  background:var(--surf-1);
  box-shadow:var(--ring), var(--hi), var(--e2)}

.fs-rg{position:absolute;left:50%;top:var(--fsY);z-index:1;
  width:calc(var(--fsL) * 1.34);aspect-ratio:1;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;
  border:1.5px solid var(--brand);opacity:.45;
  animation:fsRg 3.4s ease-out infinite}
.fs-rg.r2{animation-delay:-1.13s}
.fs-rg.r3{animation-delay:-2.27s}
@keyframes fsRg{
  0%      {transform:translate(-50%,-50%) scale(1);opacity:.45}
  75%,100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}
}

/* ---- beams : light walking those rails ---- */
.fs-beams{position:absolute;inset:0;z-index:0;pointer-events:none}
.fs-beam{position:absolute;top:0;left:0;pointer-events:none;
  width:clamp(52px,5.6vw,84px);height:3px;border-radius:3px;
  offset-rotate:auto;offset-distance:0%;
  background:linear-gradient(90deg,transparent,var(--bc,#7CC9FF) 52%,transparent);
  animation:fsStreak var(--bd,4.5s) linear infinite}
@keyframes fsStreak{
  0%  {offset-distance:100%;opacity:0}
  10% {opacity:.85}
  38% {opacity:.5}
  47% {opacity:0}
  53% {opacity:0}
  62% {opacity:.5}
  90% {opacity:.85}
  100%{offset-distance:0%;  opacity:0}
}

.fs-depth{position:absolute;inset:0;z-index:3}
.fs-track{position:absolute;inset:0;
  perspective:900px;perspective-origin:50% var(--fsY);
  transform-style:preserve-3d}

/* ---- travel wrapper : nothing but position ---- */
.fs-chip{position:absolute;top:0;left:0;z-index:2;display:inline-flex;
  offset-rotate:auto;offset-distance:100%}

/* ---- the visible pill : nothing but scale and fade ---- */
.fs-body{display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap;
  padding:.55rem .9rem;border-radius:var(--rf);font-size:.84rem;font-weight:600;
  background:var(--surf-1);color:var(--ink);
  box-shadow:var(--ring-2), var(--hi), var(--e2);
  transform-origin:center;opacity:0}
.fs-ch{width:17px;height:17px;flex:none;border-radius:50%;display:grid;place-items:center}
.fs-ch svg{width:11px;height:11px;color:#fff}
.fs-chip.out .fs-body{background:var(--surf-btn);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), var(--e-brand)}
.fs-tick{width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.26);
  display:grid;place-items:center;flex:none}
.fs-tick svg{width:9px;height:9px;stroke-width:3.6;color:#fff}


/* ---- the logo, on top: it is what conceals the chips ---- */
.fs-core{position:absolute;left:50%;top:var(--fsY);z-index:6;width:var(--fsL);
  transform:translate(-50%,-50%);filter:drop-shadow(0 8px 24px rgba(0,119,238,.45))}
.fs-core svg{width:100%;height:auto;display:block}


/* ---- travel : along the rails ----
   offset-distance runs 100% -> 50% -> 0%, so a message enters from
   the right, reaches the logo at the path midpoint, and leaves left.
   offset-rotate:auto tilts each chip to the curve's tangent. */
.fs-chip.in{animation:fsPathIn 24s linear infinite;animation-delay:var(--d,0s)}
@keyframes fsPathIn{
  0%      {offset-distance:100%;transform:translateZ(240px) rotateY(-26deg)}
  50%,100%{offset-distance:50%;transform:translateZ(-320px) rotateY(0deg)}
}
.fs-chip.out{animation:fsPathOut 24s linear infinite;animation-delay:var(--d,0s)}
@keyframes fsPathOut{
  0%,50%{offset-distance:50%;transform:translateZ(-320px) rotateY(0deg)}
  100%  {offset-distance:0%;transform:translateZ(240px) rotateY(26deg)}
}

/* ---- scale and fade : independent, so the shrink stays near the logo.
   Opacity only at the far edges; the mask handles the logo. ---- */
.fs-chip.in .fs-body{animation:fsBodyIn 24s infinite;animation-delay:var(--d,0s)}
@keyframes fsBodyIn{
  0%   {opacity:0}
  8%   {opacity:1}
  34%  {opacity:.92}
  46%  {opacity:.6}
  50%  {opacity:0}
  100% {opacity:0}
}
.fs-chip.out .fs-body{animation:fsBodyOut 24s infinite;animation-delay:var(--d,0s)}
@keyframes fsBodyOut{
  0%,50%{opacity:0}
  54%   {opacity:.55}
  70%   {opacity:.9}
  90%   {opacity:1}
  100%  {opacity:0}
}

/* ============================================================
   The symbol blinks. Two quick blinks per 6s, then a wink where
   only the right eye closes and holds a beat longer.
   fill-box keeps each eye scaling about its own centre.
   ============================================================ */
.fs-core .rd-eye,.orb-core .rd-eye{transform-box:fill-box;transform-origin:center}
.fs-core .rd-eye-l,.orb-core .rd-eye-l{animation:rdBlink 6s infinite}
.fs-core .rd-eye-r,.orb-core .rd-eye-r{animation:rdWink 6s infinite}
@keyframes rdBlink{
  0%,24.2%  {transform:scaleY(1)}
  25%       {transform:scaleY(.08)}
  25.8%     {transform:scaleY(1)}
  69.2%     {transform:scaleY(1)}
  70%       {transform:scaleY(.08)}
  70.8%,100%{transform:scaleY(1)}
}
@keyframes rdWink{
  0%,24.2%  {transform:scaleY(1)}
  25%       {transform:scaleY(.08)}
  25.8%     {transform:scaleY(1)}
  69.2%     {transform:scaleY(1)}
  70%       {transform:scaleY(.08)}
  70.8%     {transform:scaleY(1)}
  88.4%     {transform:scaleY(1)}
  89.6%     {transform:scaleY(.08)}
  92.4%     {transform:scaleY(.08)}
  93.6%,100%{transform:scaleY(1)}
}
@media (prefers-reduced-motion:reduce){
  .fs-core .rd-eye,.orb-core .rd-eye{animation:none}
}

/* Anything scrolled out of view stops costing frames. */
.anim-off,.anim-off *{animation-play-state:paused !important}

/* ============================================================

   A pill that hovers clear of the page edges instead of a bar
   bolted to the top. The pill is always solid, so it never needs
   the scrolled-backdrop trick — only its shadow deepens.
   Deliberately opaque: see the note on .hdr-in.
   ============================================================ */
:root{

  --nav-edge:rgba(255,255,255,.95);
}

.hdr{position:fixed;inset-inline:0;top:0;z-index:90;
  padding-block:clamp(10px,1.3vw,16px) 0;
  background:none;box-shadow:none;
  transition:transform .38s cubic-bezier(.2,.8,.3,1)}
/* far enough to clear the pill's shadow as well as the pill */
.hdr.nav-hide{transform:translateY(calc(-100% - 18px))}
.hdr.stuck{background:none;box-shadow:none}

/* every page clears the fixed pill; the hero cancels it and re-pads
   internally so its background still runs to the very top */
main{padding-top:var(--nav-h)}

.hdr-in{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;gap:var(--s4);
  height:auto;min-height:52px;padding:8px 8px 8px var(--s5);
  background:var(--nav-veil),var(--nav-bg);border-radius:var(--rf);color:var(--nav-ink);
  box-shadow:inset 0 1px 0 var(--nav-edge),
             inset 0 0 0 1px var(--nav-line),
             var(--e2);
  transition:box-shadow var(--dur-l) var(--ease)}
.hdr.stuck .hdr-in{box-shadow:inset 0 1px 0 var(--nav-edge),
             inset 0 0 0 1px var(--nav-line),
             var(--e3)}
:root[dir="rtl"] .hdr-in{padding:8px var(--s5) 8px 8px}

.hdr .brand{justify-self:start}
.hdr .navwrap{justify-self:center;margin-inline:0}
.hdr .hdr-act{justify-self:end}

/* the wordmark follows currentColor, so it turns white on the pill */
.hdr .brand{color:var(--nav-ink)}
.hdr .logo-lock{color:var(--nav-ink)}
.hdr .brand-t{color:var(--nav-ink)}

/* inner nav track */
.hdr .nav{background:var(--nav-soft);box-shadow:inset 0 0 0 1px var(--nav-line);
  padding:4px}
.hdr .nav a{color:var(--nav-mut)}
.hdr .nav a:hover{color:var(--nav-ink)}
.hdr .nav a.on{background:var(--nav-act);color:var(--nav-ink);
  box-shadow:inset 0 0 0 1px var(--nav-line)}

/* controls */
.hdr .ibtn{color:var(--nav-mut)}
.hdr .ibtn:hover{background:var(--nav-soft);color:var(--nav-ink);box-shadow:none}
.hdr .lang{color:var(--nav-mut);box-shadow:inset 0 0 0 1px var(--nav-line)}
.hdr .lang:hover{color:var(--nav-ink);background:var(--nav-soft);
  box-shadow:inset 0 0 0 1px var(--nav-line)}

/* the CTA inverts against the dark pill */
/* swaps ink and ground, so it inverts in either theme */
.hdr #navCta{background:var(--nav-ink);color:var(--nav-bg);box-shadow:var(--e2)}
.hdr #navCta:hover{background:var(--brand);color:#fff;transform:translateY(-1px);
  box-shadow:0 6px 18px -6px rgba(0,119,238,.6)}

/* trimmed controls to suit the slimmer pill */
.hdr .nav a{padding:.38rem .82rem;font-size:.85rem}
.hdr .nav{padding:3px}
.hdr .ibtn{width:32px;height:32px}
.hdr .lang{padding:.32rem .56rem;font-size:.75rem}
.hdr #navCta{padding:.5rem 1.05rem;font-size:.84rem}
.hdr .logo-lock{height:28px}
.hdr .logo-sym{height:27px}

/* mobile sheet hangs off the pill rather than the viewport top */
@media (max-width:860px){
  :root{--nav-h:calc(clamp(10px,1.3vw,16px) + 48px)}
  .hdr-in{display:flex;justify-content:space-between;min-height:48px;padding:7px 7px 7px var(--s4)}
  :root[dir="rtl"] .hdr-in{padding:7px var(--s4) 7px 7px}
  .navwrap{position:absolute;inset-inline:0;top:calc(100% + 8px);margin:0;
    padding-inline:var(--gut)}
  .hdr .nav{flex-direction:column;width:100%;border-radius:var(--r4);
    background:var(--nav-bg);padding:var(--s3);
    box-shadow:0 0 0 1px var(--nav-line), var(--e4)}
  .hdr .nav a{padding:.7rem .9rem;text-align:start;border-radius:var(--r2)}
}


@media (prefers-reduced-motion:reduce){
  .hdr{transition:none}
}

var CALC={conv:1500,sal:4500,min:6,rate:70};
function nfmt(n){return Math.round(n).toLocaleString(lang===0?"en-US":"en-US");}
function calcBlock(){
  var f=function(id,labK,min,max,step,val,unit){
    return '<div class="calc-f"><span class="calc-lab"><span>'+t(labK)+'</span>'+
      '<span class="calc-val" id="v'+id+'">'+nfmt(val)+(unit?' '+unit:'')+'</span></span>'+
      '<input class="rng" type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" aria-label="'+t(labK)+'"></div>';
  };
  return '<div class="surface calc rv">'+
    '<div class="calc-in">'+
      f("conv","calc_conv",100,20000,100,CALC.conv,"")+
      f("sal","calc_sal",2000,15000,250,CALC.sal,t("calc_sar"))+
      f("min","calc_min",1,20,1,CALC.min,t("calc_min_u"))+
      f("rate","calc_rate",20,90,5,CALC.rate,"%")+
      '<span class="calc-hint">'+t("calc_note")+'</span>'+
    '</div>'+
    '<div class="calc-out">'+
      '<div class="calc-hero"><span class="calc-hero-k">'+t("calc_out_k")+'</span>'+
        '<span class="calc-hero-v" id="oSave">—<small>'+t("calc_sar")+'</small></span></div>'+
      '<div class="calc-split"><i id="oBar" style="width:70%"></i></div>'+
      '<div class="calc-legend"><span><i></i>'+t("calc_leg_a")+'</span>'+
        '<span class="dim"><i></i>'+t("calc_leg_b")+'</span></div>'+

        '<div class="calc-m"><span class="calc-m-k">'+t("calc_auto")+'</span><span class="calc-m-v" id="oAuto">—</span></div>'+
        '<div class="calc-m" style="grid-column:1/-1"><span class="calc-m-k">'+t("calc_year")+'</span>'+
          '<span class="calc-m-v" id="oYear">—</span></div>'+
      '</div>'+
      '<a class="btn btn-w" href="#/contact">'+t("calc_cta")+arw()+'</a>'+
    '</div></div>';
}
function calcRun(){
  var g=function(id){var e=document.getElementById(id);return e?+e.value:0;};
  var conv=g("conv"),sal=g("sal"),mins=g("min"),rate=g("rate");
  if(!document.getElementById("conv"))return;
  var auto=conv*rate/100;
  var hours=auto*mins/60;
  var hourly=sal/176;                    /* 22 working days x 8 hours */
  var save=hours*hourly;
  var set=function(id,v){var e=document.getElementById(id);if(e)e.innerHTML=v;};
  set("vconv",nfmt(conv));
  set("vsal",nfmt(sal)+' '+t("calc_sar"));
  set("vmin",nfmt(mins)+' '+t("calc_min_u"));
  set("vrate",nfmt(rate)+'%');
  set("oSave",nfmt(save)+'<small>'+t("calc_sar")+'</small>');
  set("oHours",nfmt(hours));
  set("oAuto",nfmt(auto));
  set("oYear",nfmt(save*12)+' '+t("calc_sar"));
  var b=document.getElementById("oBar");if(b)b.style.width=rate+"%";
}
function calcBind(){
  ["conv","sal","min","rate"].forEach(function(id){
    var e=document.getElementById(id);
    if(e)e.addEventListener("input",calcRun);
  });
  calcRun();
}

function dRenderQs(){
  var box=document.getElementById("dqs");if(!box)return;
  box.innerHTML=DIA[dTab].qs.map(function(q,i){
    return '<button type="button" class="dq" data-q="'+i+'">'+p(q.q)+'</button>';}).join("");
  box.querySelectorAll(".dq").forEach(function(b){
    b.addEventListener("click",function(){dAsk(DIA[dTab].qs[+this.dataset.q]);});
  });
}
function dAsk(pair,customQ){
  var c=document.getElementById("dchat");if(!c)return;
  dStop();
  var q=customQ||p(pair.q), a=pair?p(pair.a):t("dm_fallback");
  c.innerHTML='<div class="msg them"><span class="bub">'+q.replace(/</g,"&lt;")+'</span></div>';
  var red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  dTimers.push(setTimeout(function(){
    c.insertAdjacentHTML("beforeend",'<div class="msg them tmp"><span class="typ"><i></i><i></i><i></i></span></div>');
  },red?0:180));
  dTimers.push(setTimeout(function(){
    var tp=c.querySelector(".tmp");if(tp)tp.remove();
    c.insertAdjacentHTML("beforeend",'<div class="msg us"><span class="bub">'+a+'</span>'+
      '<span class="mmeta">'+sv("spark","",2)+t("dm_demo")+'</span></div>');
  },red?0:1250));
}
function demoBind(){
  var tabs=document.getElementById("dtabs");if(!tabs)return;
  tabs.querySelectorAll(".dt").forEach(function(b){
    b.addEventListener("click",function(){
      dTab=+this.dataset.i;
      tabs.querySelectorAll(".dt").forEach(function(x){x.classList.remove("on");});
      this.classList.add("on");
      dRenderQs();
    });
  });
  dRenderQs();
  var f=document.getElementById("dform");
  if(f)f.addEventListener("submit",function(e){
    e.preventDefault();
    var inp=document.getElementById("dinput");
    var txt=(inp.value||"").trim();
    if(!txt)return;
    var hit=null;
    for(var i=0;i<MATCH.length;i++){
      if(MATCH[i].re.test(txt)){
        var d=DIA[MATCH[i].d], q=d.qs[Math.min(MATCH[i].i,d.qs.length-1)];
        hit=q;break;
      }
    }
    if(hit){ dAsk(hit,txt); }
    else{
      var c=document.getElementById("dchat");

/* Route a node to the hub: run along the dominant axis, then cut in at 45deg.
   Picking the axis by which delta is larger keeps the bend inside the frame
   in both the wide and the stacked layout. */
function hubPath(sx,sy,cx,cy,R){
  var k=R*0.7071;
  var dx=cx-sx, dy=cy-sy;
  if(Math.abs(dy)<4) return "M "+sx+" "+sy+" H "+(cx-Math.sign(dx)*R);
  if(Math.abs(dx)<4) return "M "+sx+" "+sy+" V "+(cy-Math.sign(dy)*R);
  var ex=cx-Math.sign(dx)*k, ey=cy-Math.sign(dy)*k;
  if(Math.abs(dx)>=Math.abs(dy)){
    var run=Math.abs(ey-sy);
    return "M "+sx+" "+sy+" H "+(ex-Math.sign(dx)*run)+" L "+ex+" "+ey;
  }
  var runV=Math.abs(ex-sx);
  return "M "+sx+" "+sy+" V "+(ey-Math.sign(dy)*runV)+" L "+ex+" "+ey;
}

var FS_CYCLE=24;   /* the logo is struck every FS_CYCLE/8 = 3s */

/* Five rails, wide at the edges and pinched at the logo. The SVG
   stroke and each chip's motion path are built from the SAME string,
   so a message can never drift off the line it is drawn on. Paths are
   in real pixels, rebuilt on resize. */
var FS_LANES=[.14,.27,.40,.53,.66];   /* no straight rail: every lane banks */
var FS_TOP=.19;                      /* logo height within the band */

function fsPaths(W,H){
  var cy=H*FS_TOP;
  return FS_LANES.map(function(f){
    var off=f*H, y0=(cy+off).toFixed(1), c=cy.toFixed(1);
    if(f===0) return 'M 0 '+c+' L '+W+' '+c;
    /* First control point is lifted toward the apex, so the tangent at
       the outer end is genuinely sloped — a chip enters banked. The
       second sits level with the apex, so it straightens out as it
       arrives. A symmetric flat-ended curve looked level at both the
       edge AND the logo, which is why the banking never showed. */
    var lift=(cy+off*0.28).toFixed(1);   /* lower lift = steeper tangent at the edge */
    return 'M 0 '+y0+
      ' C '+(W*0.20).toFixed(1)+' '+lift+
      ', '+(W*0.40).toFixed(1)+' '+c+
      ', '+(W*0.50).toFixed(1)+' '+c+
      ' C '+(W*0.60).toFixed(1)+' '+c+
      ', '+(W*0.80).toFixed(1)+' '+lift+
      ', '+W+' '+y0;
  });
}

   pathLength="100" normalises every rail so one dash reads the same on
   a short path and a long one. Durations and delays are deliberately
   unrelated so they never pulse together. */

        '--bc:'+b.c+';--bd:'+b.dur+'s;animation-delay:'+b.d+'s"></span>';

function orbSVG(){
  var S=620, c=S/2, pr=27;
  var still=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var rings="", pods="";

  ORB.forEach(function(ring){
    rings+='<circle class="orb-ring" cx="'+c+'" cy="'+c+'" r="'+ring.r+'"/>';
    var spin=still?'':'<animateTransform attributeName="transform" type="rotate" '+
      'from="0 '+c+' '+c+'" to="'+(360*ring.dir)+' '+c+' '+c+'" '+
      'dur="'+ring.dur+'s" repeatCount="indefinite"/>';
    var inner=ring.f.map(function(f){
      var rad=f.a*Math.PI/180;
      var x=(c+ring.r*Math.cos(rad)).toFixed(1), y=(c+ring.r*Math.sin(rad)).toFixed(1);
      /* counter-spin keeps each flag upright while its ring turns */
      var anti=still?'':'<animateTransform attributeName="transform" type="rotate" '+
        'from="0 0 0" to="'+(-360*ring.dir)+' 0 0" dur="'+ring.dur+'s" repeatCount="indefinite"/>';
      return '<g transform="translate('+x+','+y+')"><g class="orb-pod">'+anti+
        '<g clip-path="url(#podClip)">'+
          '<svg x="'+(-pr)+'" y="'+(-pr)+'" width="'+(pr*2)+'" height="'+(pr*2)+'" '+
            'viewBox="0 0 60 40" preserveAspectRatio="xMidYMid slice">'+FLAG[f.k]+'</svg>'+
        '</g><circle class="rim" r="'+pr+'"/></g></g>';
    }).join("");
    pods+='<g>'+spin+inner+'</g>';
  });

  var mw=112, mh=mw*40/36;
  return '<svg class="orb-svg" id="orbsvg" viewBox="0 0 '+S+' '+S+'" role="img" aria-label="'+t("orb_h")+'">'+
    '<defs><clipPath id="podClip"><circle cx="0" cy="0" r="'+pr+'"/></clipPath>'+
      '<radialGradient id="orbGlow"><stop offset="0%" stop-color="#0077EE" stop-opacity=".20"/>'+
      '<stop offset="100%" stop-color="#0077EE" stop-opacity="0"/></radialGradient></defs>'+
    '<circle class="orb-glow" cx="'+c+'" cy="'+c+'" r="152"/>'+
    rings+pods+
    '<g class="orb-core"><svg x="'+(c-mw/2)+'" y="'+(c-mh*0.45)+'" width="'+mw+'" height="'+mh+'" '+
      'viewBox="0 0 36 40" fill="none">'+LOGO.sym+'</svg></g>'+
  '</svg>';
}

var perfIO=null;
function perfWatch(){
  if(perfIO) perfIO.disconnect();
  if(!('IntersectionObserver' in window)) return;
  perfIO=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      var el=e.target, on=e.isIntersecting;
      el.classList.toggle('anim-off',!on);
      if(el.tagName&&el.tagName.toLowerCase()==='svg'&&el.pauseAnimations){
        try{ on ? el.unpauseAnimations() : el.pauseAnimations(); }catch(err){}
      }
    });
  },{rootMargin:'160px 0px'});
  document.querySelectorAll('.fs,.hub-svg,.orb-svg,.band,.shot').forEach(function(el){
    perfIO.observe(el);
  });
}

var io=null;
function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});
  },{rootMargin:"0px 0px -6% 0px",threshold:.05});
  document.querySelectorAll(".rv").forEach(function(el){io.observe(el);});
}

(function boot(){
  var sl=null,st=null;
  try{sl=localStorage.getItem("rd5-lang");st=localStorage.getItem("rd5-theme");}catch(e){}
  lang=sl==="1"?1:0;
  document.documentElement.lang=lang===0?"ar":"en";
  document.documentElement.dir=lang===0?"rtl":"ltr";
  if(st)document.documentElement.setAttribute("data-theme",st);

  document.getElementById("langBtn").addEventListener("click",function(){setLang(lang===0?1:0);});
  document.getElementById("themeBtn").addEventListener("click",function(){
    var c=document.documentElement.getAttribute("data-theme");
    if(!c)c=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
    var n=c==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",n);
    try{localStorage.setItem("rd5-theme",n);}catch(e){}});
  document.getElementById("burger").addEventListener("click",function(){
    var w=document.getElementById("navwrap");
    this.setAttribute("aria-expanded",String(w.classList.toggle("open")));});
  window.addEventListener("hashchange",function(){render();window.scrollTo(0,0);});
  /* Hide the pill on the way down, bring it back on the way up.
     Direction is measured against the last point where we actually
     acted, not the previous frame, so a few stray pixels of momentum
     cannot flip it back and forth. */
  var navLastY = window.scrollY || 0, navHidden = false, navTick = false;
  function navScroll(){
    navTick = false;
    var hdr = document.getElementById("hdr");
    if(!hdr) return;
    var y = Math.max(0, window.scrollY);
    hdr.classList.toggle("stuck", y > 8);

    var menuOpen = document.getElementById("navwrap").classList.contains("open");
    var dy = y - navLastY;

    if(y <= 160 || menuOpen){          /* always visible near the top, or while the menu is open */
      if(navHidden){ navHidden = false; hdr.classList.remove("nav-hide"); }
      navLastY = y;
      return;
    }
    if(Math.abs(dy) < 8) return;       /* ignore jitter */
    var wantHide = dy > 0;
    if(wantHide !== navHidden){
      navHidden = wantHide;
      hdr.classList.toggle("nav-hide", navHidden);
    }
    navLastY = y;
  }
  window.addEventListener("scroll",function(){
    if(navTick) return;
    navTick = true;
    requestAnimationFrame(navScroll);
  },{passive:true});
  render();
})();

})();
</script>
